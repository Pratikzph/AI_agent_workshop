name: Claude Code Issue Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    # Only fire on issue comments (not PR comments) that mention @claude
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai PyGithub

      - name: Fix issue via GitHub Models (no API key needed)
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:          ${{ github.repository }}
          ISSUE_NUMBER:  ${{ github.event.issue.number }}
          ISSUE_TITLE:   ${{ github.event.issue.title }}
          ISSUE_BODY:    ${{ github.event.issue.body }}
          COMMENT_BODY:  ${{ github.event.comment.body }}
        run: python .github/scripts/claude_fix.py
