name: Claude Code Issue Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          base_branch: main
          branch_prefix: "fix/"
          show_full_output: true
          direct_prompt: |
            Fix the GitHub issue described above.

            Steps you MUST follow:
            1. Read the issue title and body carefully — they are already in your context.
            2. Explore the repository files to understand the current state of the code.
            3. Make the necessary file edits or create new files to resolve the issue.
            4. Run: git checkout -b fix/issue-$ISSUE_NUMBER
            5. Stage and commit all changes.
            6. Push the branch and open a pull request against main with:
               - Title starting with "fix:"
               - Body with Summary, Changes, and "Closes #$ISSUE_NUMBER"
            7. Post a comment on the issue with the PR link.

            You MUST create a pull request before finishing. Do not stop without one.
