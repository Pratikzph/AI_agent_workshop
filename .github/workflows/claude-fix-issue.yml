name: Claude Code Issue Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    # Trigger only on issue comments (not PR comments) containing @claude
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          show_full_output: true
          direct_prompt: |
            You are an automated issue fixer. The triggering issue number is ${{ github.event.issue.number }}.

            Run the fix-issue skill by reading and following every step in
            .claude/commands/fix-issue.md with argument ${{ github.event.issue.number }}.

            The skill will guide you to:
              1. Create a branch    (.claude/commands/create-branch.md)
              2. Analyse the issue  (.claude/commands/analyze-issue.md)
              3. Develop the fix    (.claude/commands/develop.md)
              4. Open a PR          (.claude/commands/create-pr.md)

            Do not finish until a pull request has been created and a comment
            has been posted on issue #${{ github.event.issue.number }} with the PR link.
