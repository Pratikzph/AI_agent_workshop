name: Claude Code Issue Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write        # push fix branch
  pull-requests: write   # open PR
  issues: write          # comment on issue
  id-token: write        # REQUIRED by claude-code-action for OIDC auth

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    # Only fire on issue comments (not PR comments) that mention @claude
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          base_branch: main
          branch_prefix: "fix/"
          show_full_output: true
          prompt: |
            You are fixing GitHub issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}
            Issue body:
            ${{ github.event.issue.body }}

            Triggered by comment:
            ${{ github.event.comment.body }}

            Instructions:
            1. Read the issue title and body above carefully.
            2. Explore the repository files to understand the codebase.
            3. Implement the fix by editing or creating the necessary files.
            4. If the issue asks for a new feature or file, create it.
            5. Commit your changes to a new branch named fix/issue-${{ github.event.issue.number }}.
            6. Open a pull request against main with:
               - Title: "fix: <concise description of what was resolved>"
               - Body containing:
                 ## Summary
                 What the issue was and how it was fixed.
                 ## Changes
                 Bullet list of files modified and why.
                 ## How to verify
                 Steps to confirm the fix works.
                 Closes #${{ github.event.issue.number }}
            7. Post a comment on the issue linking to the PR.

            IMPORTANT: Always make at least one file change and open a PR.
            Never finish without creating a pull request.
