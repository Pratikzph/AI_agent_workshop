name: Claude Code Issue Fixer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: ""
          base_branch: dev
          branch_prefix: "fix/"
          prompt: |
            Read the issue title and description carefully, then implement the necessary code changes to resolve it.
            After implementing the fix, create a pull request with:
            - Title: a concise "fix: <what was resolved>" derived from the actual changes made
            - Description with these sections:
              ## Summary
              What the issue was and how it was fixed.
              ## Changes
              Bullet list of files/functions modified and why.
              ## How to verify
              Steps to confirm the fix works.
              ---
              Closes #${{ github.event.issue.number }}